    <style>
        body {
            font-family: "Lexend", sans-serif;
            background: radial-gradient(circle at center, rgb(37, 37, 37) 0%, #2c2c2c 100%);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* --- CONTENEDOR DE TARJETAS (Modo Escritorio: Grid 2 y 3 Columnas) --- */
        .menu {
            background: none;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            max-width: 1000px;
            width: 90%;
            gap: 22px;
            margin-top: 15px;
            margin-bottom: 140px;
            box-sizing: border-box;
        }

        @media (min-width: 1280px) {
            .menu {
                grid-template-columns: repeat(3, 1fr);
                max-width: 1240px;
                gap: 26px;
            }
        }

        /* --- TARJETAS EN ESCRITORIO (Más compactas y proporcionadas) --- */
        .btn-servicio {
            position: relative;
            background-color: transparent;
            color: red;
            padding: 0px;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 115px;
            min-height: 115px;
            overflow: hidden;
            margin: 0px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-sizing: border-box;
        }

        .btn-servicio:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 24px rgba(200, 0, 0, 0.35);
        }

        /* La última tarjeta (Medios de contacto) centrada y estética */
        .btn-contacto {
            grid-column: 1 / -1;
            max-width: 480px;
            justify-self: center;
            width: 100%;
        }

        .btn-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            border-radius: 18px;
        }

        .btn-servicio i,
        .btn-servicio .btn-text,
        .btn-servicio .btn-img {
            z-index: 1;
            position: relative;
        }

        .btn-text {
            font-family: "Lexend", sans-serif;
            flex-grow: 1;
            text-align: left;
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: left;
            margin-left: 20px;
            padding-right: 10px;
            line-height: 1.25;
            font-weight: bold;
            text-decoration: none;
        }

        .btn-img {
            height: 85%;
            max-height: 95px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0;
            padding: 0;
            margin-right: 22px;
            animation: rotarLadoALado 3s ease-in-out infinite;
            transform-origin: center bottom;
            filter: drop-shadow(-2px 4px 6px rgba(0, 0, 0, 0.45));
        }

        .btn-img[src=""],
        .btn-img:not([src]) {
            display: none;
        }

        .botonLadoIzquierdo {
            fill: darkred;
            transition: fill 0.3s ease;
        }

        .botonLadoDerecho {
            fill: #7c0000;
            animation: cambioColorRojo 4s ease-in-out infinite;
        }

        @keyframes rotarLadoALado {
            0% {
                transform: rotate(-9deg);
            }
            50% {
                transform: rotate(10deg);
            }
            100% {
                transform: rotate(-10deg);
            }
        }

        @keyframes cambioColorRojo {
            0%, 100% {
                fill: #b9b9b9;
            }
            50% {
                fill: #353535;
            }
        }

        /* --- MODO MÓVIL (Conserva exactamente el estilo vertical grande y limpio) --- */
        @media (max-width: 850px),
        (max-width: 1080px) and (-webkit-min-device-pixel-ratio: 1.8),
        (max-width: 1080px) and (min-resolution: 1.8dppx) {
            .menu {
                display: flex;
                flex-direction: column;
                width: 90%;
                gap: 60px;
                margin-top: 50px;
                margin-bottom: 300px;
            }

            .btn-servicio {
                min-height: 200px;
                height: auto;
                font-size: 35px;
                border-radius: 20px;
                width: 100%;
                box-shadow: none;
            }

            .btn-servicio:hover {
                transform: none;
                box-shadow: none;
            }

            .btn-contacto {
                grid-column: auto;
                max-width: 100%;
                width: 100%;
            }

            .btn-text {
                font-size: 40px;
                margin-left: 20px;
            }

            .btn-img {
                height: 100%;
                max-height: 250px;
                margin-right: 100px;
            }

            .btn-svg {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 0;
                pointer-events: none;
                border-radius: 20px;
            }
        }
    </style>
